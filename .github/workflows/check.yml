name: Check web app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run repository checks
        run: |
          node tests/release-check.mjs
          node tests/reliability-scenarios.mjs
